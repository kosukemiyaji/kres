services:
  - type: web
    name: kres-discord-bot
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
